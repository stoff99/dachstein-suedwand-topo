# Veröffentlicht den Ordner web/ auf GitHub Pages.
#
# Einrichten: im Repository unter Settings -> Pages als Quelle "GitHub Actions"
# wählen. Danach läuft das hier bei jedem Push auf main.
#
# Die Bildkacheln liegen fertig im Repository und werden nicht hier gebaut - das
# entspricht dem späteren Ablauf: stitchen und kacheln passiert lokal, hochgeladen
# wird das Ergebnis.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # GitHub Pages liefert jede Datei mit max-age=600 aus und lässt keine eigenen
      # Kopfzeilen zu. Ohne Kennung in der Adresse sieht man eine Änderung bis zu
      # zehn Minuten lang nicht - oder eine neue Seite mit altem Stylesheet.
      - name: Dateiverweise mit Auslieferungskennung versehen
        run: python3 tools/stamp_assets.py --build "${GITHUB_SHA::8}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
